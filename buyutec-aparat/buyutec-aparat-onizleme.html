const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
new GLTFLoader().parse(bin.buffer,'',g=>{
  const obj=g.scene;
  obj.traverse(n=>{if(n.isMesh){n.material=new THREE.MeshStandardMaterial({color:0x5b8dee,metalness:.15,roughness:.5});}});
  const box=new THREE.Box3().setFromObject(obj), c=box.getCenter(new THREE.Vector3()), s=box.getSize(new THREE.Vector3());
  obj.position.sub(c);
  const grid=new THREE.GridHelper(Math.max(s.x,s.y,s.z)*2.5,20,0x444466,0x2a2a44);
  grid.position.y=-s.y/2; scene.add(grid); scene.add(obj);
  cam.position.set(s.length()*.9,s.length()*.7,s.length()*.9);
  ctrl.update();
});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
(function loop(){requestAnimationFrame(loop);ctrl.update();ren.render(scene,cam)})();
